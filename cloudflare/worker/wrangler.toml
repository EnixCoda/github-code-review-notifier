name = "github-webhook-filter"
main = "src/index.js"
compatibility_date = "2026-09-10"
workers_dev = true

[vars]
REQUIRE_HOOKSHOT = "true"
ORIGIN_URL = "https://github-code-review-notifier.enix.one"

[[d1_databases]]
binding = "github_webhook_filter"
database_name = "github-webhook-filter"
database_id = "08783b56-b134-4a4e-9952-c0598e44a481"

# ---------------------------------------------------------------------------
# PRODUCTION (default `wrangler deploy`)
#   Intercepts every path on the real webhook host so variants such as
#   `/github/` or `/GitHub` cannot bypass the filter. Non-webhook paths are
#   proxied to Vercel unchanged. Subrequests to the same zone bypass this
#   route, so forwarding does not loop.
# ---------------------------------------------------------------------------
[[routes]]
pattern = "github-code-review-notifier.enix.one/*"
zone_name = "enix.one"

# ---------------------------------------------------------------------------
# PREVIEW / STAGING (`wrangler deploy --env staging`)
#   Bound to the preview domain, which is already proxied through Cloudflare.
#   Uses the same all-paths route so path variants are exercised before prod.
#   Safe: real users' webhooks point at the long domain.
# ---------------------------------------------------------------------------
[env.staging]
name = "github-webhook-filter-staging"
workers_dev = true

[env.staging.vars]
REQUIRE_HOOKSHOT = "true"
ORIGIN_URL = "https://test.enix.one"

[[env.staging.d1_databases]]
binding = "github_webhook_filter"
database_name = "github-webhook-filter"
database_id = "08783b56-b134-4a4e-9952-c0598e44a481"

[[env.staging.routes]]
pattern = "test.enix.one/*"
zone_name = "enix.one"
